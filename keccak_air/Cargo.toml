[package]
name = "keccak_air"
description = "An AIR for the Keccak-f permutation, assuming a field size between 2^16 and 2^32."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.local/keccak_air"
homepage = "https://example.local/keccak_air"
keywords = ["stark", "air", "keccak"]
categories = ["cryptography", "algorithms"]

[dependencies]
p3-air.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true
p3-keccak.workspace = true
p3-symmetric.workspace = true

rand.workspace = true
tracing.workspace = true

[dev-dependencies]
# Upstream Plonky3 crates for tests
p3-keccak-air.workspace = true
p3-goldilocks.workspace = true
sha3.workspace = true

tracing-forest.workspace = true
tracing-subscriber.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
test-utils = []
