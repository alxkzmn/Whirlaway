[package]
name = "whirlaway"
version = "0.1.0"
edition = "2024"

[lib]
path = "../src/lib.rs"

[[bin]]
name = "whirlaway"
path = "../src/main.rs"

[dependencies]
air = { path = "../crates/air" }
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
tracing = "0.1.26"
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
rand = "0.10.0"
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
keccak_air = { path = "../keccak_air" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
sha3 = "0.10.8"
tracing-forest = { version = "0.1.6", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.19", features = ["std", "env-filter"] }
whir-p3 = { path = "../../../whir-p3" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
utils = { package = "whirlaway-utils", path = "../crates/utils" }
bincode = "1.3.3"
serde = { version = "1.0.219", features = ["derive"] }

[features]
default = ["hash_count"]
hash_count = ["whir-p3/hash_count"]
keccak_no_prefix = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
utils = { package = "whirlaway-utils", path = "../crates/utils" }
keccak_air = { path = "../keccak_air", features = ["test-utils"] }
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
sumcheck = { path = "../crates/sumcheck" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
whir-p3 = { path = "../../../whir-p3" }

[[bench]]
name = "folding_benchmarks"
path = "../benches/folding_benchmarks.rs"
harness = false

[[bench]]
name = "poseidon2_proof"
path = "../benches/poseidon2_proof.rs"
harness = false

[[bench]]
name = "keccak_proof"
path = "../benches/keccak_proof.rs"
harness = false

[[example]]
name = "evm_vectors"
path = "../examples/evm_vectors.rs"

[[test]]
name = "air_prove_verify"
path = "../tests/air_prove_verify.rs"

[[test]]
name = "evm_proof_blob"
path = "../tests/evm_proof_blob.rs"

[[test]]
name = "keccak_public_values"
path = "../tests/keccak_public_values.rs"

[[test]]
name = "proof_serde"
path = "../tests/proof_serde.rs"

[[test]]
name = "sponge_zero_iv"
path = "../tests/sponge_zero_iv.rs"

[[test]]
name = "sumcheck_integration"
path = "../tests/sumcheck_integration.rs"
